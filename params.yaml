ingest:
  cache_dir: data/external
  raw: data/raw/covertype.csv
  wilderness_column: Wilderness_Area_0
  n_rows: 10000
  seed: 42
data:
  target: Cover_Type
  test_size: 0.2
  split_seed: 42
featurize:
  drop:
  - Wilderness_Area_0
  - Wilderness_Area_1
  - Wilderness_Area_2
  - Wilderness_Area_3
train:
  model: random_forest
  n_estimators: 200
  max_depth: 20
  min_samples_leaf: 1
  seed: 42
  n_jobs: -1
evaluate:
  min_accuracy: 0.7
